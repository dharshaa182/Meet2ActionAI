<!DOCTYPE html>
<html>
<head>
    <title>Upload Meeting Audio</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            background: #f4f6f8;
            margin: 0;
            padding: 40px;
        }

        .container {
            max-width: 600px;
            margin: auto;
            background: white;
            padding: 35px;
            border-radius: 15px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.1);
            text-align: center;
        }

        h1 {
            margin-bottom: 10px;
        }

        p {
            color: #666;
        }

        input[type="file"] {
            margin: 25px 0;
            padding: 12px;
            width: 90%;
            border: 1px solid #ccc;
            border-radius: 8px;
        }

        button {
            background: #111;
            color: white;
            border: none;
            padding: 13px 25px;
            border-radius: 8px;
            cursor: pointer;
            font-size: 16px;
        }

        button:hover {
            background: #333;
        }

        .back {
            display: block;
            margin-top: 25px;
            text-decoration: none;
            color: #333;
        }
    </style>
</head>

<body>

<div class="container">

    <h1>🎙️ Upload Meeting Audio</h1>

    <p>
        Upload your meeting recording to process it with Meet2Action.
    </p>

    <form action="/upload_audio" method="POST" enctype="multipart/form-data">

        <input
            type="file"
            name="audio"
            accept="audio/*"
            required
        >

        <br>

        <button type="submit">
            Upload Audio
        </button>

    </form>

    <a class="back" href="/">
        ← Back to Home
    </a>

</div>

</body>
</html>
